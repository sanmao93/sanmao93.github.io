<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云栈 · Codespaces 工作台</title>
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --muted:#6e6e73; --bg:#fff; --card:#f7f7f8; --line:#e3e3e5; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#f5f5f7; --muted:#a1a1a6; --bg:#0d0d0f; --card:#17171a; --line:#2a2a2e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 16px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
         -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 96px 24px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .dot { width:40px; height:40px; border-radius:12px; background:linear-gradient(145deg,#3a3a3f,#111114); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  .name { font-size:20px; font-weight:600; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13.5px; }
  h1 { font-size: 28px; line-height:1.35; margin:0 0 16px; letter-spacing:-.015em; }
  p { margin: 0 0 14px; color:var(--fg); }
  .muted { color:var(--muted); }
  .links { display:flex; gap:12px; flex-wrap:wrap; margin-top:36px; }
  a.btn { display:inline-block; text-decoration:none; border:1px solid var(--line); background:var(--card);
          border-radius:10px; padding:10px 18px; font-size:15px; font-weight:500; }
  footer { color:var(--muted); font-size:13.5px; margin-top:64px; border-top:1px solid var(--line); padding-top:20px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <span class="dot"></span>
    <span><span class="name">云栈</span><br><span class="sub">Codespaces 工作台</span></span>
  </div>

  <h1>在 Mac 上管理 GitHub Codespaces</h1>
  <p>云栈是一款原生 macOS 的 GitHub Codespaces 工作台，把云端实例管理、内嵌终端与资源监控集中在一个窗口。</p>
  <p class="muted">独立开发的第三方客户端，与 GitHub 无官方关联。</p>

  <div class="links">
    <a class="btn" href="support.html">支持</a>
    <a class="btn" href="privacy.html">隐私政策</a>
  </div>

  <footer>© 2026 guangping zhou</footer>
</main>
</body>
</html>
